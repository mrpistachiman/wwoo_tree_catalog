<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WWOO Tree Catalog</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#f6f5f1; --panel:#fff; --ink:#1f2328; --muted:#6b6f76; --line:#e3e1db; --accent:#3d7a3a; --chip:#f0efe9; --sky:#e9f0f6; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16181b; --panel:#1f2226; --ink:#e7e7e4; --muted:#9a9ea5; --line:#30343a; --accent:#7cc276; --chip:#2a2e33; --sky:#1b232b; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--ink); }
  header { position:sticky; top:0; z-index:5; background:var(--panel); border-bottom:1px solid var(--line); padding:12px 20px; }
  .top { display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
  h1 { font-size:17px; margin:0 10px 0 0; }
  .ver { color:var(--muted); font-size:11px; }
  input, select { font:inherit; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:5px 8px; }
  label { color:var(--muted); font-size:12px; display:flex; flex-direction:column; gap:3px; }
  .facet { margin:6px 0 0; } .facet b { display:inline-block; width:90px; color:var(--muted); font-size:12px; }
  .chip { font:inherit; font-size:12px; border:1px solid var(--line); background:var(--panel); color:var(--ink); border-radius:14px;
          padding:2px 9px; margin:2px 3px 2px 0; cursor:pointer; display:inline-flex; align-items:center; gap:5px; }
  .chip.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  .chip .n { color:var(--muted); font-size:11px; } .chip.on .n { color:#e8f5e8; }
  main { padding:16px 20px 60px; }
  .count { color:var(--muted); margin:12px 0 10px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(180px, 1fr)); gap:10px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:8px 10px 10px; cursor:pointer; display:flex; flex-direction:column; }
  .card:hover { border-color:var(--accent); }
  .pic { background:var(--sky); border-radius:6px; height:150px; display:flex; align-items:flex-end; justify-content:center; padding:4px; margin-bottom:8px; }
  .pic .none { color:var(--muted); font-size:12px; align-self:center; }
  .card .name { font-weight:600; font-size:13px; }
  .meta { color:var(--muted); font-size:12px; }
  .dot { width:12px; height:12px; border-radius:3px; border:1px solid rgba(0,0,0,.25); display:inline-block; }
  .bark { border-radius:50%; }
  .sw { display:inline-flex; align-items:center; gap:4px; margin:1px 7px 1px 0; font-size:12px; }
  .badge { display:inline-block; font-size:11px; padding:1px 7px; border-radius:10px; background:var(--chip); margin-right:4px; }
  canvas.tree { image-rendering:pixelated; display:block; }
  dialog { border:1px solid var(--line); border-radius:12px; background:var(--panel); color:var(--ink); max-width:min(920px, 94vw); width:920px; padding:18px 20px; }
  dialog::backdrop { background:rgba(0,0,0,.45); }
  .views { display:flex; gap:20px; align-items:flex-end; flex-wrap:wrap; background:var(--sky); border-radius:8px; padding:12px; }
  .views figure { margin:0; } figcaption { color:var(--muted); font-size:11px; text-align:center; margin-top:4px; }
  h2 { margin:0 0 4px; font-size:18px; } h3 { font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:16px 0 6px; }
  table { border-collapse:collapse; width:100%; } td, th { text-align:left; padding:4px 8px; border-bottom:1px solid var(--line); font-size:13px; }
  th { color:var(--muted); font-size:12px; font-weight:600; }
  code { font:12px ui-monospace, Menlo, monospace; background:var(--chip); padding:1px 5px; border-radius:4px; word-break:break-all; }
  .cmd { display:flex; gap:6px; align-items:center; margin:3px 0; }
  button.small { font:inherit; font-size:11px; border:1px solid var(--line); background:var(--bg); color:var(--ink); border-radius:5px; padding:2px 8px; cursor:pointer; }
  .close { float:right; }
  .bar { height:6px; background:var(--chip); border-radius:3px; overflow:hidden; width:120px; display:inline-block; vertical-align:middle; margin-right:6px; }
  .bar > i { display:block; height:100%; background:var(--accent); }
</style>
</head>
<body>
<header>
  <div class="top">

  </div>
</header>
<main>

  <p class="count" id="count"></p>
  <div class="grid" id="grid"></div>
</main>

  biome: {label: "Grows in", values: t => t.where.length ? t.where.map(w => w[0]) : ["none"], name: biomeName},
  leaves: {label: "Leaves", values: t => t.leaves, name: b => `<i class="dot" style="background:${LEAF[b] || "#888"}"></i>${pretty(b)}`},
  wood: {label: "Wood", values: t => t.wood, name: b => `<i class="dot bark" style="background:${WOOD[woodKey(b)] || "#777"}"></i>${pretty(b)}`},
  size: {label: "Size", values: t => [t.sizeClass], name: v => `${v} <span class="n">(${SIZE_HINT[v]})</span>`},
};
function matches(t, skip) {
  const q = $("#q").value.toLowerCase().trim();
  if (q) {
    const hay = [t.name, ...t.leaves.map(l => l + " leaves"), ...t.wood, ...t.ids, ...t.where.map(w => w[0])].join(" ").replace(/_/g, " ").toLowerCase();
    if (!q.split(/\s+/).every(w => hay.includes(w))) return false;
  }
  for (const [k, f] of Object.entries(FACETS)) {
    if (k === skip || !F[k].size) continue;
    const vals = f.values(t);
    for (const want of F[k]) if (!vals.includes(want)) return false;
  }
  return true;
}
function render() {
  let h = "";
  for (const [k, f] of Object.entries(FACETS)) {
    const counts = new Map();
    for (const t of D.trees) if (matches(t, k) && [...F[k]].every(w => f.values(t).includes(w)))
      for (const v of new Set(f.values(t))) counts.set(v, (counts.get(v) || 0) + 1);
    for (const v of F[k]) if (!counts.has(v)) counts.set(v, 0);
    const opts = [...counts.entries()].sort((a, b) => k === "size" ? SIZES.indexOf(a[0]) - SIZES.indexOf(b[0]) : b[1] - a[1] || String(a[0]).localeCompare(String(b[0])));
    h += `<div class="facet"><b>${f.label}</b>` + opts.map(([v, n]) =>
      `<button class="chip${F[k].has(v) ? " on" : ""}" data-f="${k}" data-v="${v}">${f.name(v)} <span class="n">${n}</span></button>`).join("") + `</div>`;
  }
  $("#facets").innerHTML = h;
  document.querySelectorAll(".chip").forEach(c => c.onclick = () => {
    const s = F[c.dataset.f]; s.has(c.dataset.v) ? s.delete(c.dataset.v) : s.add(c.dataset.v); render();
  });
  const sort = $("#sort").value;
  const list = D.trees.map((t, i) => [t, i]).filter(([t]) => matches(t))
    .sort(([a], [b]) => sort === "tall" ? height(b) - height(a) : sort === "wide" ? width(b) - width(a) : sort === "common" ? common(b) - common(a) : title(a).localeCompare(title(b)));
  $("#count").textContent = `${list.length} of ${D.trees.length} trees`;
  $("#grid").innerHTML = list.map(([t, i]) => `<div class="card" data-i="${i}">
      <div class="pic">${treeCanvas(t, "front", 160, 140, 4)}</div>
      <div class="name">${title(t)}</div>
      <div>${t.leaves.slice(0, 2).map(b => leafChip(b, t)).join("")}${t.wood.slice(0, 1).map(woodChip).join("")}</div>
      <div class="meta"><span class="badge">${t.sizeClass}</span>${height(t) ? height(t) + " tall · " + width(t) + " wide" : ""}</div></div>`).join("");
  document.querySelectorAll(".card").forEach(c => c.onclick = () => openTree(+c.dataset.i));
}
function share(list, chip) {
  return list ? `<table>${list.map(([b, p]) => `<tr><td>${chip(b)}</td><td><span class="bar"><i style="width:${p}%"></i></span>${p}%</td></tr>`).join("")}</table>` : "";
}
function openTree(i) {
  const t = D.trees[i];
  const natives = t.where.filter(w => !w[2].length), borders = t.where.filter(w => w[2].length);
  let h = `<button class="small close" onclick="document.getElementById('detail').close()">close</button>
    <h2>${title(t)}</h2><div class="meta"><span class="badge">${t.sizeClass}</span>${height(t) ? `${height(t)} blocks tall, ${width(t)} wide (this sample)` : ""}</div>
    <h3>Pictures</h3>`;
  h += t.view ? `<div class="views"><figure>${treeCanvas(t, "front", 400, 360, 7)}<figcaption>front</figcaption></figure>
      <figure>${treeCanvas(t, "side", 400, 360, 7)}<figcaption>side</figcaption></figure></div>
      <div class="meta">One sample as the game generated it; every tree varies.${t.tint ? ` Leaf colours as in ${t.tintBiome ? biomeName(t.tintBiome) : "the default biome"}; they change with the biome.` : ""}</div>` : `<p class="meta">No picture.</p>`;
  h += `<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
    <div><h3>Leaves</h3>${share(t.leafShare, b => leafChip(b, t)) || t.leaves.map(b => leafChip(b, t)).join("")}</div>
    <div><h3>Trunk / wood</h3>${share(t.woodShare, woodChip) || t.wood.map(woodChip).join("")}</div></div>`;
  h += `<h3>Grows naturally in</h3>` + (natives.length ? `<table><tr><th>Biome</th><th>Share of the biome's trees</th></tr>` +
    natives.map(([b, p]) => `<tr><td>${biomeName(b)}</td><td><span class="bar"><i style="width:${Math.min(100, p)}%"></i></span>${p < 1 ? "<1" : Math.round(p)}%</td></tr>`).join("") + `</table>`
    : borders.length ? `<p class="meta">Only near other biomes (below).</p>`
    : `<p class="meta"><b>Doesn't generate in worlds.</b> WWOO defines this tree but none of its biomes place it; /place still works.</p>`);
  if (borders.length) h += `<h3>Also near biome borders</h3><table>` + borders.map(([b, , n]) =>
    `<tr><td>${biomeName(b)}</td><td class="meta">within ~16 blocks of ${n.map(biomeName).join(" or ")}</td></tr>`).join("") + `</table>`;
  const mixes = t.mixes || {};
  h += `<h3>Place it</h3>` + (t.ids.length ? t.ids.map(id => {
    const c = `/place feature ${id} ~ ~ ~`;
    const mix = mixes[id] ? `<div class="meta">A WWOO mix: may grow ${mixes[id].map(n => n.split("/").map(pretty).join(" · ")).join(", ")} instead.</div>` : "";
    return `<div class="cmd"><code>${c}</code><button class="small" data-copy="${c}">copy</button></div>${mix}`;
  }).join("") + (t.ids.length > 1 ? `<div class="meta">Look-alike variants, one id each.</div>` : "")
    + (t.pieces ? `<div class="meta">WWOO builds this tree from random pieces: one command may place only a piece (branches, roots). Repeat it on the same spot.</div>` : "")
    : `<p class="meta">WWOO has no id of its own for this tree; it is defined inside a larger feature.</p>`);
  const dlg = $("#detail"); dlg.innerHTML = h; dlg.showModal();
  dlg.querySelectorAll("[data-copy]").forEach(b => b.onclick = () => navigator.clipboard.writeText(b.dataset.copy)
    .then(() => { b.textContent = "copied"; setTimeout(() => b.textContent = "copy", 1200); }, () => { b.textContent = "select it"; }));
}
$("#q").oninput = render; $("#sort").onchange = render;
$("#clear").onclick = () => { Object.values(F).forEach(s => s.clear()); $("#q").value = ""; render(); };
$("#detail").onclick = e => { if (e.target.id === "detail") e.target.close(); };
const V = D.versions || {};
$("#ver").textContent = [V.wwoo && `WWOO v${V.wwoo}`, V.minecraft && `Minecraft ${V.minecraft}`].filter(Boolean).join(" · ");
render();
</script>
</body>
</html>
